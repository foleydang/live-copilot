# FAQ 知识库：keywords 命中即用 answer 回复（本地规则层直接用；
# LLM 层会把这里压缩成参考摘要）。answer 上限约 50 字，口语化。
# ★ 下面是示例内容，正式使用前请替换成工作室真实信息。
faqs:
  - keywords: ["多少钱", "价格", "怎么卖", "贵不贵"]
    intent: price
    answer: "亲亲，壶的价格在页面小黄车里都标着呢，您可以点开看看，喜欢哪把可以扣个编号～"

  - keywords: ["发货", "几天发货", "多久发货", "什么时候发", "快递", "邮费", "包邮", "物流"]
    intent: shipping
    answer: "拍下后48小时内发货哦，韵达或顺丰，偏远地区补点邮费，包装我们都会加固的～"

  - keywords: ["瑕疵", "开裂", "质量", "售后", "退换"]
    intent: product
    answer: "每一把都是纯手工的，出厂前都检查过，有瑕疵支持退换，放心拍～"

  - keywords: ["拉坯", "阴刻", "阳填", "怎么做的", "多久学会", "手艺"]
    intent: craft
    answer: "这是建水紫陶的传统阴刻阳填工艺，具体手法主播腾出空来给大家演示哈～"

  - keywords: ["烧窑", "烧几天", "进窑", "窑", "烧制", "泥料"]
    intent: craft
    answer: "进窑要烧好几天，出窑有惊喜也有遗憾，所以每一把都是独一无二的～"

  - keywords: ["杯子", "壶", "茶叶罐", "有什么"]
    intent: product
    answer: "小黄车里都是现售的壶和杯子，主播手上正在做的这把做好也会上架～"

  - keywords: ["关注", "你好", "来了", "晚上好", "大家好"]
    intent: greeting
    answer: "欢迎新进来的朋友，主播正在手工拉坯，有任何问题尽管打在公屏上～"

  - keywords: ["好看", "漂亮", "厉害", "支持", "666", "点赞"]
    intent: interaction
    answer: "谢谢支持！喜欢的话点个小红心，主播会更有劲头哒～"
