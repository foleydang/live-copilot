<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120e0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>小陶 · AI 助播</title>
<style>
  :root{ --bg1:#1c1511; --bg2:#0b0908; --ink:#fff8f2; --dim:#a8968a; --accent:#ff9d5c; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg2); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
    overflow:hidden; user-select:none; }
  #stage{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; padding:calc(env(safe-area-inset-top) + 18px) 18px 24px;
    background:radial-gradient(120% 80% at 50% 18%, #2a1f18 0%, var(--bg1) 45%, var(--bg2) 100%); }
  .tag{ display:flex; align-items:center; gap:8px; font-size:13px; letter-spacing:.5px;
    color:var(--dim); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08);
    padding:7px 14px; border-radius:999px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:#5b5049; }
  .dot.on{ background:#4ade80; box-shadow:0 0 10px #4ade80; }
  .dot.bad{ background:#ef4444; }

  .charwrap{ flex:1; width:100%; display:flex; align-items:center; justify-content:center; }
  svg{ width:min(92vw,400px); height:auto; max-height:62vh; overflow:visible; }
  #glow{ opacity:0; transition:opacity .35s; }
  #glow.on{ opacity:1; }
  #char{ transform-origin:200px 330px; animation:sway 5.2s ease-in-out infinite; }
  @keyframes sway{ 0%,100%{ transform:rotate(-1.2deg) translateY(0); } 50%{ transform:rotate(1.2deg) translateY(-4px); } }
  #breathe{ transform-origin:200px 250px; animation:breathe 3.8s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ transform:scaleY(1); } 50%{ transform:scaleY(1.025); } }
  #eyes{ transform-origin:200px 168px; animation:blink 6.4s infinite; }
  @keyframes blink{ 0%,92%,100%{ transform:scaleY(1); } 95%{ transform:scaleY(.08); } }

  .sub{ width:100%; max-width:100%; min-height:132px; padding:0 4px; display:flex; align-items:flex-end; justify-content:center; }
  .sub p{ margin:0; width:100%; min-width:0; flex:1 1 auto; font-size:clamp(17px,4.8vw,25px); line-height:1.5;
    font-weight:700; text-align:center; color:#fff; text-shadow:0 2px 18px rgba(0,0,0,.75);
    word-break:break-word; overflow-wrap:anywhere; padding:0 16px; max-width:100%; }
  .sub p.dim{ color:#7c6d63; font-size:20px; font-weight:500; }
  .foot{ margin-top:14px; font-size:12px; color:#5f544c; letter-spacing:.4px; }
</style>
</head>
<body>
<div id="stage">
  <div class="tag"><span class="dot" id="dot"></span><span id="who">小陶 · AI 助播</span></div>

  <div class="charwrap">
    <svg viewBox="0 0 400 380" aria-label="小陶">
      <defs>
        <radialGradient id="g1" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffb877" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#ffb877" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#d3764d"/><stop offset="100%" stop-color="#a9532f"/>
        </linearGradient>
      </defs>

      <circle id="glow" cx="200" cy="160" r="150" fill="url(#g1)"/>
      <ellipse cx="200" cy="352" rx="120" ry="14" fill="#000" opacity=".38"/>

      <g id="char">
        <g id="breathe">
          <!-- 身体 -->
          <path d="M138 300 Q138 232 200 232 Q262 232 262 300 Q262 340 200 340 Q138 340 138 300 Z" fill="url(#apron)"/>
          <path d="M170 242 Q200 262 230 242" stroke="#fff2e6" stroke-width="10" stroke-linecap="round" fill="none" opacity=".85"/>
          <!-- 手臂 -->
          <path d="M150 268 Q126 292 140 316" stroke="#d3764d" stroke-width="20" stroke-linecap="round" fill="none"/>
          <path d="M250 268 Q274 292 260 316" stroke="#d3764d" stroke-width="20" stroke-linecap="round" fill="none"/>
          <!-- 脖子 -->
          <rect x="186" y="212" width="28" height="30" rx="12" fill="#e8b48c"/>
          <!-- 头 -->
          <circle cx="200" cy="158" r="78" fill="#f7d3b2"/>
          <!-- 发髻 -->
          <ellipse cx="200" cy="88" rx="27" ry="24" fill="#4a342a"/>
          <ellipse cx="200" cy="106" rx="15" ry="11" fill="#5a4034"/>
          <circle cx="122" cy="168" r="11" fill="#eec39e"/>
          <circle cx="278" cy="168" r="11" fill="#eec39e"/>
          <!-- 眉眼 -->
          <g id="eyes">
            <ellipse cx="174" cy="162" rx="9" ry="12" fill="#2b211b"/>
            <ellipse cx="226" cy="162" rx="9" ry="12" fill="#2b211b"/>
            <circle cx="177" cy="158" r="3" fill="#fff" opacity=".9"/>
            <circle cx="229" cy="158" r="3" fill="#fff" opacity=".9"/>
          </g>
          <path d="M162 138 Q174 131 186 137" stroke="#4a342a" stroke-width="5" stroke-linecap="round" fill="none"/>
          <path d="M214 137 Q226 131 238 138" stroke="#4a342a" stroke-width="5" stroke-linecap="round" fill="none"/>
          <!-- 腮红 -->
          <ellipse cx="157" cy="192" rx="14" ry="8" fill="#f0796a" opacity=".28"/>
          <ellipse cx="243" cy="192" rx="14" ry="8" fill="#f0796a" opacity=".28"/>
          <!-- 嘴 -->
          <ellipse id="mouth" cx="200" cy="200" rx="15" ry="5" fill="#7d3a2c"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="sub"><p id="line" class="dim">正在连接…</p></div>
  <div class="foot">这件小事，我来招呼</div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEMO = new URLSearchParams(location.search).has('demo');
let ws = null, retry = 2, speaking = false, mouthTimer = null;
const q = [];

/* ---- 说话：嘴型 + 字幕 ---- */
function mouthOn(){
  if(mouthTimer) return;
  mouthTimer = setInterval(()=>{
    const m = $('mouth');
    const open = 5 + Math.random() * 17;
    m.setAttribute('ry', open.toFixed(1));
    m.setAttribute('rx', (13 + Math.random()*4).toFixed(1));
  }, 85);
  $('glow').classList.add('on');
}
function mouthOff(){
  if(mouthTimer){ clearInterval(mouthTimer); mouthTimer = null; }
  const m = $('mouth'); m.setAttribute('ry','5'); m.setAttribute('rx','15');
  $('glow').classList.remove('on');
}
function showLine(text){ $('line').classList.remove('dim'); $('line').textContent = text; }

function speak(text, b64){
  q.push({text, b64});
  if(!speaking) next();
}
function next(){
  if(!q.length){ speaking = false; mouthOff(); return; }
  speaking = true;
  const {text, b64} = q.shift();
  showLine(text);
  mouthOn();
  const done = () => { mouthOff(); setTimeout(next, 180); };
  const p = $('player');
  if(b64){
    p.src = 'data:audio/wav;base64,' + b64;
    p.onended = done;
    p.onerror = () => tts(text, done);
    const pr = p.play();
    if(pr && pr.catch) pr.catch(() => tts(text, done));
  } else {
    tts(text, done);
  }
}
function tts(text, done){
  if(!('speechSynthesis' in window)){ setTimeout(done, 2200); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.onend = done; u.onerror = done;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---- 连接 ---- */
function setDot(cls){ $('dot').className = 'dot' + (cls ? ' ' + cls : ''); }
function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { setDot('on'); retry = 2; };
  ws.onclose = (e) => {
    setDot('bad');
    if(e.code === 4401){ $('line').classList.add('dim'); $('line').textContent = '未登录，请先在助播台登录'; return; }
    setTimeout(connect, retry * 1000);
    retry = Math.min(retry * 2, 30);
  };
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(_){ return; }
    if(m.type === 'hello'){
      const name = m.assistant_name || '小陶';
      $('who').textContent = name + ' · AI 助播';
      document.title = name + ' · AI 助播';
      if(!speaking && !q.length){ $('line').classList.add('dim'); $('line').textContent = '我在，随时说话'; }
      return;
    }
    if(m.type === 'audio'){ speak(m.text, m.audio); return; }
  };
}

/* ---- 演示模式：没连上也能看效果 ---- */
const DEMO_LINES = [
  '这个是我自己做的，你看这个边儿，都是一点点磨出来的。',
  '有姐妹问发货几天，今天下午下单，明天就给你寄出去。',
  '你要是喜欢深一点的，我这儿还有同款，我拿给你看看。',
  '不着急啊，慢慢看，我就在这儿。'
];
function runDemo(){
  let i = 0;
  const tick = () => {
    const text = DEMO_LINES[i++ % DEMO_LINES.length];
    showLine(text);
    mouthOn();
    setTimeout(() => { mouthOff(); setTimeout(tick, 1200); }, 3200);
  };
  $('line').classList.remove('dim');
  setTimeout(tick, 400);
}

/* ---- 常亮 ---- */
let wakeLock = null;
async function keepAwake(){
  try{ wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; }); }catch(_){}
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && !wakeLock) keepAwake();
});

if(DEMO) runDemo(); else connect();
keepAwake();
</script>
<audio id="player"></audio>
</body>
</html>
