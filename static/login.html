<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AI 助播台</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --accent:#4ade80; --text:#e5e7eb; --dim:#9ca3af; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         display:flex; align-items:center; justify-content:center; padding:20px; }
  .wrap { width:100%; max-width:360px; }
  .title { text-align:center; margin-bottom:24px; }
  .title h1 { font-size:26px; margin:0 0 10px; font-weight:700; }
  .title p { margin:0; font-size:17px; color:#d1d5db; font-weight:600; }
  .title .sub { margin-top:7px; font-size:13.5px; color:var(--dim); }
  .card { background:var(--card); border-radius:16px; padding:24px 20px; }
  .tabs { display:flex; gap:6px; margin-bottom:20px; }
  .tab { flex:1; padding:12px; text-align:center; border-radius:10px;
         background:#1f232b; font-size:15px; font-weight:600; color:var(--dim); cursor:pointer; }
  .tab.on { color:#06281a; background:var(--accent); }
  label { display:block; font-size:15px; font-weight:600; margin:16px 0 8px; }
  label:first-of-type { margin-top:0; }
  input { width:100%; padding:14px; border-radius:10px; border:1px solid #2b303b;
          background:#12151b; color:var(--text); font-size:17px; font-family:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; padding:16px; margin-top:20px; border:none; border-radius:12px;
           font-size:17px; font-weight:700; background:var(--accent); color:#06281a; cursor:pointer; }
  button:disabled { opacity:.5; }
  .msg { font-size:14px; padding:12px; border-radius:10px; margin-top:16px; display:none; text-align:center; }
  .msg.ok { display:block; background:rgba(74,222,128,.15); color:#bbf7d0; }
  .msg.err { display:block; background:rgba(239,68,68,.15); color:#fecaca; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <h1>🎙 AI 助播台</h1>
    <p>把手从屏幕上解放出来</p>
    <div class="sub">重复的问题我替你答，你专心做手上的活</div>
  </div>

  <div class="card">
    <div class="tabs">
      <div class="tab on" onclick="tab('login')">登录</div>
      <div class="tab" onclick="tab('reg')">注册新账号</div>
    </div>

    <div id="loginBox">
      <label>用户名</label>
      <input id="l_user" placeholder="填你注册时取的名字" autocapitalize="none">
      <label>密码</label>
      <input id="l_pass" type="password" placeholder="填你的密码">
      <button onclick="login()">登录</button>
    </div>

    <div id="regBox" class="hide">
      <label>取个用户名</label>
      <input id="r_user" placeholder="英文或数字，3~24位" autocapitalize="none">
      <label>设个密码</label>
      <input id="r_pass" type="password" placeholder="至少6位">
      <button onclick="reg()">注册</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
function tab(t){
  $('loginBox').classList.toggle('hide',t!=='login');
  $('regBox').classList.toggle('hide',t!=='reg');
  document.querySelectorAll('.tab').forEach((e,i)=>{
    e.classList.toggle('on',(i===0&&t==='login')||(i===1&&t==='reg'));
  });
  $('msg').className='msg';
}
function say(t,ok){ const m=$('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }
async function go(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let d={}; try{d=await r.json();}catch(e){}
  if(!r.ok||d.ok===false) throw new Error(d.error||('HTTP '+r.status));
  return d;
}
async function login(){
  try{ await go('/api/login',{username:$('l_user').value.trim(),password:$('l_pass').value}); location.href='/'; }
  catch(e){ say(e.message); }
}
async function reg(){
  try{ await go('/api/register',{username:$('r_user').value.trim(),password:$('r_pass').value}); location.href='/?welcome=1'; }
  catch(e){ say(e.message); }
}
</script>
</body>
</html>
