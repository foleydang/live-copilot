<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="助播">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/static/manifest.json">
<title>AI 助播台</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --accent:#4ade80; --warn:#fbbf24; --text:#e5e7eb; --dim:#9ca3af; --line:#262a33; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:9; }
  .hrow { display:flex; align-items:center; gap:9px; }
  h1 { font-size:16px; margin:0; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:#ef4444; flex:0 0 auto; }
  .dot.on { background:var(--accent); box-shadow:0 0 7px var(--accent); }
  .stats { margin-left:auto; font-size:11px; color:var(--dim); text-align:right; line-height:1.45; }
  .tabs { display:flex; gap:7px; margin-top:9px; }
  .tab { flex:1; padding:10px; text-align:center; border-radius:10px; background:#1f232b;
         font-size:15px; font-weight:600; color:var(--dim); }
  .tab.on { color:#06281a; background:var(--accent); }
  .status { font-size:12px; color:var(--dim); margin-top:8px; padding:7px 10px;
            background:#151821; border-radius:8px; border-left:3px solid var(--line); }
  .status.ok { border-left-color:var(--accent); color:#bbf7d0; }
  .status.bad { border-left-color:#ef4444; color:#fecaca; }
  main { padding:12px 14px 90px; }
  section { background:var(--card); border-radius:13px; padding:14px; margin-bottom:12px; }
  h2 { font-size:13px; margin:0 0 10px; color:var(--dim); font-weight:600; }
  .empty { color:#4b5563; font-size:14px; padding:6px 0; }

  /* 直播间输入 */
  .room-input { display:flex; gap:10px; }
  .room-input input { flex:1; padding:16px; font-size:22px; font-weight:600; text-align:center;
                      border-radius:12px; border:2px solid #2b303b; background:#12151b; color:var(--text); }
  .room-input input:focus { outline:none; border-color:var(--accent); }
  .room-input button { flex:0 0 110px; padding:16px; border-radius:12px; font-size:16px; font-weight:700;
                        background:var(--accent); color:#06281a; border:none; cursor:pointer; }
  .room-input button:active { transform:scale(.97); }

  /* 提词 */
  .prompt-item { border-left:4px solid var(--warn); padding:10px 12px; margin-bottom:8px;
                 background:#20242c; border-radius:0 10px 10px 0; }
  .prompt-item .who { font-size:11px; color:var(--warn); margin-bottom:3px; }
  .prompt-item .what { font-size:22px; line-height:1.3; font-weight:600; }
  .prompt-item.stale { opacity:.35; }

  /* AI 回答 */
  .assist-item { font-size:14px; line-height:1.5; padding:8px 0; border-bottom:1px solid #23272f; color:#d1d5db; }
  .assist-item:last-child { border-bottom:none; }
  .assist-item .tag { color:var(--accent); font-size:11px; margin-right:5px; }

  /* 底部按钮 */
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom));
         background:linear-gradient(transparent, var(--bg) 30%); display:flex; gap:9px; z-index:8; }
  .bar button { padding:14px; border:none; border-radius:11px; font-size:15px; font-weight:600;
                background:#2b303b; color:var(--text); cursor:pointer; flex:1; }
  .bar button.primary { background:var(--accent); color:#06281a; }
  .bar button:active { transform:scale(.98); }
  #muteBtn.on { background:#7f1d1d; color:#fecaca; }

  /* 设置表单 */
  label { display:block; font-size:14px; color:#cbd5e1; margin:14px 0 6px; font-weight:600; }
  label:first-child { margin-top:0; }
  input, textarea { width:100%; padding:12px; border-radius:10px; border:1px solid #2b303b;
                    background:#12151b; color:var(--text); font-size:16px; font-family:inherit; }
  textarea { min-height:70px; resize:vertical; line-height:1.5; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .rowlist > div { display:flex; gap:7px; margin-bottom:7px; }
  .rowlist input { flex:1; }
  .del { flex:0 0 42px; padding:12px 0; text-align:center; background:#3a2020; color:#fca5a5;
         border-radius:10px; font-size:16px; cursor:pointer; }
  .save { width:100%; padding:16px; font-size:17px; background:var(--accent); color:#06281a;
          border-radius:12px; font-weight:700; border:none; margin-top:14px; cursor:pointer; }
  .mini { padding:9px 14px; font-size:14px; border-radius:10px; background:#2b303b; color:var(--text);
          border:none; margin-top:8px; cursor:pointer; }
  .msg { font-size:14px; padding:12px; border-radius:10px; margin-top:12px; display:none; text-align:center; }
  .msg.ok { display:block; background:rgba(74,222,128,.13); color:#bbf7d0; }
  .msg.err { display:block; background:rgba(239,68,68,.13); color:#fecaca; }
  .hide { display:none; }
  .logout { width:100%; padding:14px; margin-top:20px; background:#3a2020; color:#fca5a5;
            border-radius:12px; border:none; font-size:15px; font-weight:600; cursor:pointer; }

  /* 大盘入口 */
  .entry { cursor:pointer; }
  .entry:active { background:#1f232b; }
  .entry-row { display:flex; align-items:center; justify-content:space-between; }
  .entry-title { font-size:17px; font-weight:700; }
  .entry-sub { font-size:12.5px; color:var(--dim); margin-top:4px; }
  .entry-arrow { font-size:26px; color:var(--dim); line-height:1; }
  .hint { font-size:12px; color:#6b7280; line-height:1.55; }

  /* 试听 + 音频状态 */
  .test-row { display:flex; gap:9px; align-items:center; }
  .test-row button { padding:14px; border-radius:11px; border:none; background:#2b303b;
            color:var(--text); font-size:15px; font-weight:600; cursor:pointer; flex:1; }
  .test-row button:active { transform:scale(.97); }
  .audio-state { font-size:13px; color:var(--dim); }
  .audio-state.ok { color:var(--accent); }
  .audio-state.bad { color:#ef4444; }

  /* 正在播放 - 提词器 */
  .nowplay { display:none; margin-top:14px; }
  .nowplay.on { display:block; }
  .nowplay .np-label { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:1px; margin-bottom:6px; }
  .nowplay .np-bar { background:var(--accent); height:3px; border-radius:2px; margin-bottom:10px;
            animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  .nowplay .np-text { font-size:28px; line-height:1.3; font-weight:700; color:#fff;
            min-height:36px; }
  .nowplay .np-next { font-size:14px; color:var(--dim); margin-top:10px; line-height:1.45;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nowplay .np-meta { display:flex; align-items:center; justify-content:space-between; gap:10px;
            margin-top:12px; font-size:12px; color:#6b7280; }
  .nowplay .np-skip { padding:9px 14px; border-radius:9px; border:1px solid #3a4150;
            background:transparent; color:var(--text); font-size:13px; font-weight:600; }
  .nowplay .np-skip:active { background:#2b303b; }

  /* 音量警告 */
  .vol-warn { display:none; background:rgba(239,68,68,.15); border:1px solid #ef4444;
            border-radius:11px; padding:14px; margin-top:12px; }
  .vol-warn.on { display:block; }
  .vol-warn .vw-title { font-size:16px; font-weight:700; color:#fecaca; margin-bottom:4px; }
  .vol-warn .vw-sub { font-size:13px; color:#fca5a5; line-height:1.5; }
</style>
</head>
<body>
<header>
  <div class="hrow">
    <span class="dot" id="dot"></span>
    <h1 id="room">AI 助播台</h1>
    <div class="stats" id="stats">未连接</div>
  </div>
  <div class="tabs">
    <div class="tab on" id="tabLive" onclick="showTab('live')">直播</div>
    <div class="tab" id="tabSet" onclick="showTab('set')">设置</div>
  </div>
  <div class="status" id="status">未连接</div>
</header>

<main>
  <!-- ============ 直播 ============ -->
  <div id="paneLive">
    <section>
      <h2>📡 直播间号</h2>
      <div class="room-input">
        <input id="roomInput" inputmode="numeric" placeholder="填直播间号">
        <button onclick="saveRoom()">连接</button>
      </div>
      <div class="msg" id="roommsg"></div>
    </section>

    <section>
      <h2>🔊 声音检查</h2>
      <div class="test-row">
        <button onclick="testAudio()">▶ 试听一声</button>
      </div>
      <div class="audio-state" id="audioState" style="margin-top:10px">还没试听</div>
      <div class="vol-warn" id="volWarn">
        <div class="vw-title">⚠️ 可能没有声音</div>
        <div class="vw-sub">检查这部手机的音量是不是被关了，或者对录线是不是没插好。</div>
      </div>
      <div class="nowplay" id="nowplay">
        <div class="np-label">● AI 正在说</div>
        <div class="np-bar"></div>
        <div class="np-text" id="npText"></div>
        <div class="np-next" id="npNext"></div>
        <div class="np-meta">
          <span id="npMeta"></span>
          <button class="np-skip" onclick="skipCurrent()">跳过这条 ›</button>
        </div>
      </div>
    </section>

    <section class="entry" onclick="openReport()">
      <div class="entry-row">
        <div>
          <div class="entry-title">📊 数据大盘</div>
          <div class="entry-sub" id="entrySub">AI 答了多少、多少转给了你</div>
        </div>
        <div class="entry-arrow">›</div>
      </div>
    </section>
  </div>

  <!-- ============ 数据大盘 ============ -->
  <div id="paneRep" class="hide">
    <button class="mini" style="margin:0 0 10px" onclick="showTab('live')">‹ 返回直播</button>
    <section>
      <h2>AI 干了多少活</h2>
      <div id="repHead"><div class="empty">加载中…</div></div>
    </section>
    <section>
      <h2>答不上来、转给你的问题</h2>
      <div id="repGaps"><div class="empty">加载中…</div></div>
      <div class="hint" style="margin-top:8px;color:#6b7280">同一类问题被问 2 次以上就会列在这里。把它补进设置，下次 AI 就能自己答。</div>
    </section>
    <section>
      <h2>问得最多的问题</h2>
      <div id="repHot"><div class="empty">加载中…</div></div>
    </section>
    <button class="save" onclick="loadReport()">刷新</button>
  </div>

  <!-- ============ 设置 ============ -->
  <div id="paneSet" class="hide">
    <section>
      <h2>店铺信息</h2>
      <label>店名 / 工作室名</label>
      <input id="k_studio" placeholder="例如 老王紫陶">
      <label>AI 助手名字</label>
      <input id="k_assistant" placeholder="小陶">
    </section>

    <section>
      <h2>常见问题</h2>
      <div class="rowlist" id="k_faqs"></div>
      <button class="mini" onclick="addRow('k_faqs','观众问','怎么答')">＋ 加一条</button>
    </section>

    <section>
      <h2>商品和价格</h2>
      <div class="rowlist" id="k_products"></div>
      <button class="mini" onclick="addRow('k_products','商品名','价格')">＋ 加一个</button>
    </section>

    <section>
      <h2>其他信息</h2>
      <label>发货</label>
      <textarea id="k_shipping" placeholder="48小时内发货，顺丰包邮"></textarea>
      <label>能不能定制</label>
      <textarea id="k_custom" placeholder="支持刻字，周期15天"></textarea>
      <label>进店打招呼</label>
      <textarea id="k_greeting" placeholder="欢迎新进来的朋友～"></textarea>
      <label>AI 答不上来时说什么</label>
      <textarea id="k_fallback" placeholder="这个请主播来回答一下"></textarea>
      <label>本店规矩</label>
      <textarea id="k_rules" placeholder="一行一条，如：&#10;不议价&#10;只走小黄车"></textarea>
    </section>

    <button class="save" onclick="saveProfile(event)">保存设置</button>
    <div class="msg" id="kbmsg"></div>

    <div id="acctInfo" style="text-align:center;font-size:13px;color:var(--dim);margin-top:16px"></div>
    <button class="logout" onclick="logout()">退出登录</button>
  </div>
</main>

<div class="bar">
  <button class="primary" id="startBtn" onclick="start()">开始助播</button>
  <button id="muteBtn" onclick="toggleMute()">🔇 静音</button>
</div>

<audio id="player"></audio>

<script>
let ws=null, started=false, prompts=[], assists=[], authed=false, ME={}, wakeLock=null;
let wsDownSince=0, reloadTimer=null;
const $=id=>document.getElementById(id);
const h=x=>x||{};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showTab(t){
  $('paneLive').classList.toggle('hide',t!=='live');
  $('paneSet').classList.toggle('hide',t!=='set');
  $('paneRep').classList.toggle('hide',t!=='rep');
  $('tabLive').classList.toggle('on',t==='live');
  $('tabSet').classList.toggle('on',t==='set');
  if(t==='set') loadKb();
  if(t==='rep') loadReport();
}

function openReport(){ showTab('rep'); }

function setStatus(text,cls){ const s=$('status'); s.textContent=text; s.className='status'+(cls?' '+cls:''); }

function renderStats(s){
  if(!s) return;
  $('stats').innerHTML=`AI答 ${s.assist_count||0}<br>转主播 ${s.prompt_count||0}`;
  const sub=$('entrySub');
  if(sub) sub.textContent=`AI 答了 ${s.assist_count||0} 条，转给你 ${s.prompt_count||0} 条`;
}

function connect(delay){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen=()=>{ $('dot').classList.add('on'); setStatus('已连接','ok'); wsDownSince=0; if(reloadTimer){clearTimeout(reloadTimer); reloadTimer=null;} };
  ws.onclose=e=>{
    $('dot').classList.remove('on');
    if(e.code===4401){ setStatus('请先登录','bad'); location.href='/login'; return; }
    const d=delay||2; setStatus(`断开，${d}秒后重连…`,'bad');
    if(!wsDownSince) wsDownSince=Date.now();
    // 断线超过 90 秒，直接刷页自愈
    if(!reloadTimer) reloadTimer=setTimeout(()=>{ location.reload(); }, 90000);
    setTimeout(()=>connect(Math.min((d||2)*2,30)),(d||2)*1000);
  };
  ws.onmessage=e=>handle(JSON.parse(e.data));
}

/* 屏幕常亮（助播期间不锁屏） */
async function requestWakeLock(){
  try{ wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{ wakeLock=null; }); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(wakeLock===null && document.visibilityState==='visible' && started) requestWakeLock();
});

/* 试听 */
function testAudio(){
  if(speaking){ $('audioState').textContent='AI 正在说话，等它说完再试'; return; }
  const st=$('audioState'); st.className='audio-state'; st.textContent='正在播放…';
  const text='测试测试，助播声音正常，能听到吗？';
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=1;
  u.onstart=()=>{ showSpeaking(text); };
  u.onend=()=>{ hideSpeaking(); st.className='audio-state ok'; st.textContent='✓ 播完了，你听到了吗？';
    $('volWarn').classList.remove('on'); };
  u.onerror=()=>{ hideSpeaking();
    st.className='audio-state bad'; st.textContent='✕ 播放失败';
    $('volWarn').classList.add('on'); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function handle(m){
  if(m.type==='hello'){
    $('room').textContent=`${m.studio_name||m.room} · AI助播台`;
    $('roomInput').value=m.room_id||'';
    prompts=(m.pending||[]).map(p=>({...p,at:Date.now()}));
    renderStats(m.stats);
    const mb=$('muteBtn');
    if(m.muted){ mb.classList.add('on'); mb.textContent='🔇 已静音'; }
    setStatus(`已连接 · ${m.connected?'弹幕采集中':'等待弹幕'} · AI助手「${m.assistant_name}」`,'ok');
    if(!m.kb_filled) showTab('set');
    return;
  }
  if(m.type==='status'){ setStatus(m.text||'状态更新',m.live?'ok':''); return; }
  if(m.type==='prompt'){ prompts.unshift({text:m.text,at:Date.now()}); prompts=prompts.slice(0,12); renderStats({prompt_count:prompts.length}); return; }
  if(m.type==='audio'){ assists.unshift({text:m.text,at:Date.now()}); assists=assists.slice(0,30); renderStats({assist_count:assists.length}); speak(m.text,m.audio); }
}

/* 正在播放指示 */
function showSpeaking(text){
  const np=$('nowplay'); np.classList.add('on');
  $('npText').textContent=text;
  renderNow();
}
function hideSpeaking(){
  $('nowplay').classList.remove('on');
  $('npNext').textContent=''; $('npMeta').textContent='';
}

/* 音频队列：只保留最新几条，宁可跳过也不让 AI 越说越落后 */
const MAX_Q=3;
const audioQ=[];
let speaking=false, dropped=0;

function speak(text,b64){
  if(audioQ.length>=MAX_Q){ audioQ.shift(); dropped++; }
  audioQ.push({text,b64,t0:Date.now()});
  if(!speaking) playNext(); else renderNow();
}

function renderNow(){
  const next=audioQ[0];
  $('npNext').textContent = next ? `下一句：${next.text}` : '';
  const meta=[];
  if(audioQ.length) meta.push(`排队 ${audioQ.length} 条`);
  if(dropped) meta.push(`已跳过 ${dropped} 条过期`);
  $('npMeta').textContent = meta.join(' · ');
}

function playNext(){
  if(!audioQ.length){ speaking=false; hideSpeaking(); return; }
  speaking=true;
  const {text,b64}=audioQ.shift();
  showSpeaking(text);
  const p=$('player');
  const done=()=>{ p.onended=null; p.onerror=null; playNext(); };
  if(b64){
    p.src='data:audio/wav;base64,'+b64;
    p.onended=done;
    p.onerror=()=>{ $('volWarn').classList.add('on'); speakFallback(text,done); };
    const pr=p.play();
    if(pr && pr.catch) pr.catch(()=>{ $('volWarn').classList.add('on'); speakFallback(text,done); });
  } else {
    speakFallback(text,done);
  }
}

/* 浏览器自带语音兜底：onerror 也要接，否则队列会卡死 */
function speakFallback(text,done){
  if(!('speechSynthesis' in window)){ done(); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN';
  u.onend=done; u.onerror=done;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* 主播手动跳过当前这条 */
function skipCurrent(){
  const p=$('player');
  p.onended=null; p.onerror=null;
  try{ p.pause(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  playNext();
}

async function toggleMute(){
  const btn=$('muteBtn'); btn.disabled=true;
  const want=!btn.classList.contains('on');
  try{
    const r=await fetch('/api/mute',{method:'POST',headers:h({'Content-Type':'application/json'}),body:JSON.stringify({muted:want})});
    const d=await r.json();
    if(d.ok){ btn.classList.toggle('on',d.muted); btn.textContent=d.muted?'🔇 已静音':'🔇 静音'; }
  }catch(e){}
  btn.disabled=false;
}

async function start(){
  if(started) return;
  started=true; $('startBtn').textContent='助播中';
  requestWakeLock();
  connect();
}

/* 设置：FAQ 行 */
function addRow(id,ph1,ph2){
  const div=document.createElement('div');
  div.innerHTML=`<input placeholder="${ph1}" class="q"><input placeholder="${ph2}" class="a"><div class="del" onclick="this.parentElement.remove()">✕</div>`;
  $(id).appendChild(div);
}
function readRows(id){
  return [...$(id).children].map(r=>({
    q: (r.querySelector('.q') && r.querySelector('.q').value || '').trim(),
    a: (r.querySelector('.a') && r.querySelector('.a').value || '').trim()
  })).filter(x=>x.q&&x.a);
}
function fillRows(id,items,ph1,ph2){
  $(id).innerHTML='';
  (items||[]).forEach(i=>{ addRow(id,ph1,ph2); const div=$(id).lastElementChild; div.querySelector('.q').value=i.q||''; div.querySelector('.a').value=i.a||''; });
}

/* 默认模板：开店常被问的就这几条，直接填空就行 */
const DEFAULT_FAQS=[
  {q:'几天发货',a:''},
  {q:'能不能定制',a:''},
  {q:'有现货吗',a:''}
];

async function loadKb(){
  try{
    const r=await fetch('/api/kb',{headers:h()});
    if(!r.ok) return;
    const d=await r.json();
    const p=d.profile||{};
    // 店名两处同源：知识库有就用，没有就用账号里的
    $('k_studio').value=p.studio_name||ME.studio_name||'';
    $('k_assistant').value=p.assistant_name||'小陶';
    $('k_shipping').value=p.shipping||'';
    $('k_custom').value=p.custom||'';
    $('k_greeting').value=p.greeting||'';
    $('k_fallback').value=p.fallback||'';
    $('k_rules').value=(p.rules||[]).join('\n');
    const faqs=(p.craft_qa&&p.craft_qa.length)?p.craft_qa:DEFAULT_FAQS;
    fillRows('k_faqs',faqs,'观众问','怎么答');
    const prods=(p.products||[]).map(x=>({q:x.name,a:x.price}));
    fillRows('k_products',prods.length?prods:[{q:'',a:''}],'商品名','价格');
  }catch(e){}
}

async function saveProfile(ev){
  const btn=ev.target; btn.textContent='保存中…'; btn.disabled=true;
  const studio=$('k_studio').value.trim();
  const profile={
    assistant_name:$('k_assistant').value.trim()||'小陶',
    studio_name:studio,
    greeting:$('k_greeting').value.trim(), shipping:$('k_shipping').value.trim(),
    custom:$('k_custom').value.trim(), fallback:$('k_fallback').value.trim(),
    rules:$('k_rules').value.split('\n').map(s=>s.trim()).filter(Boolean),
    products:readRows('k_products').map(x=>({name:x.q,price:x.a})),
    craft_qa:readRows('k_faqs').map(x=>({q:x.q,a:x.a}))
  };
  const m=$('kbmsg');
  try{
    const r=await fetch('/api/kb',{method:'POST',headers:h({'Content-Type':'application/json'}),body:JSON.stringify({profile})});
    const d=await r.json();
    if(!r.ok||!d.ok){ m.className='msg err'; m.textContent='保存失败：'+(d.error||r.status); }
    else{
      m.className='msg ok';
      m.textContent='已保存，AI 现在认识 '+d.faqs+' 类问题';
      if(studio){ $('room').textContent=studio; ME.studio_name=studio; }
      setStatus('设置已保存','ok');
    }
  }catch(e){ m.className='msg err'; m.textContent='网络错误'; }
  btn.textContent='保存设置'; btn.disabled=false;
}

async function saveRoom(){
  const rid=$('roomInput').value.trim();
  const m=$('roommsg');
  if(!rid){ m.className='msg err'; m.textContent='请填直播间号'; return; }
  m.className='msg'; m.textContent='';
  try{
    const r=await fetch('/api/room',{method:'POST',headers:h({'Content-Type':'application/json'}),body:JSON.stringify({room_id:rid})});
    const d=await r.json();
    if(!r.ok||!d.ok){ m.className='msg err'; m.textContent=d.error||'保存失败'; return; }
    ME.room_id=d.room_id;
    m.className='msg ok';
    m.textContent='直播间号已保存，正在连接弹幕…';
    setStatus('直播间号 '+d.room_id+' · 正在连接弹幕…','ok');
    if(!ME.kb_filled) setTimeout(()=>showTab('set'),900);
  }catch(e){ m.className='msg err'; m.textContent='网络错误'; }
}

/* ---------- 数据大盘 ---------- */
function bar(pct,color){
  pct=Math.max(0,Math.min(100,pct||0));
  return `<div style="background:#23272f;border-radius:6px;height:9px;overflow:hidden;margin-top:5px"><div style="width:${pct}%;height:100%;background:${color}"></div></div>`;
}

async function loadReport(){
  try{
    const r=await fetch('/api/report',{headers:h()});
    if(!r.ok){ $('repHead').innerHTML='<div class="empty">读取失败</div>'; return; }
    const a=await r.json();
    if(a.empty){ $('repHead').innerHTML='<div class="empty">本场还没有数据</div>'; $('repGaps').innerHTML='<div class="empty">暂无</div>'; $('repHot').innerHTML='<div class="empty">暂无</div>'; return; }
    const c=a.counts, cov=a.coverage;
    $('repHead').innerHTML=`
      <div style="font-size:40px;font-weight:700;color:var(--accent);line-height:1.1">${cov.ai_rate_pct}%</div>
      <div style="font-size:12.5px;color:var(--dim);margin-bottom:8px">AI 承接率 · 需回应 ${cov.needs_reply} 条，AI 答了 ${cov.ai_answered} 条</div>
      ${bar(cov.ai_rate_pct,'var(--accent)')}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;font-size:13px">
        <div>弹幕总数 <b>${c.total}</b></div>
        <div>AI 出声 <b style="color:var(--accent)">${c.assist}</b></div>
        <div>转给你 <b style="color:var(--warn)">${c.prompt}</b></div>
        <div>灌水忽略 <b>${c.ignore}</b></div>
        <div>礼物互动 <b>${c.social}</b></div>
        <div>时长 <b>${a.duration_min}</b> 分钟</div>
      </div>`;
    const gaps=a.kb_gaps||[];
    $('repGaps').innerHTML=gaps.length
      ? gaps.map(g=>`<div class="assist-item"><span class="tag" style="color:var(--warn)">${g.count}次</span>${esc(g.text)}</div>`).join('')
      : '<div class="empty">暂时没有，说明你填的资料够用</div>';
    const hot=a.hot_questions||[];
    $('repHot').innerHTML=hot.length
      ? hot.map(q=>`<div class="assist-item"><span class="tag">${q.count}次</span>${esc(q.text)}</div>`).join('')
      : '<div class="empty">暂无</div>';
  }catch(e){ $('repHead').innerHTML='<div class="empty">网络错误</div>'; }
}

async function logout(){
  try{ await fetch('/api/logout',{method:'POST'}); }catch(e){}
  location.href='/login';
}

async function bootstrap(){
  try{
    const r=await fetch('/api/me',{headers:h()});
    if(r.status===401||r.status===403){ location.href='/login'; return; }
    const me=await r.json();
    ME=me; authed=true;
    $('room').textContent=`${me.studio_name||'AI 助播台'}`;
    $('roomInput').value=me.room_id||'';
    $('acctInfo').textContent=`账号：${me.username}`;
    if(new URLSearchParams(location.search).get('welcome')==='1'){
      try{ history.replaceState({},'','/'); }catch(e){}
      showTab('set');
    }
    if(!me.room_id) setStatus('请先填直播间号','bad');
    else if(!me.kb_filled) setStatus('直播间号 '+me.room_id+' 已保存 · 请先填写设置','bad');
    else setStatus('直播间号 '+me.room_id+' 已保存 · 点「开始助播」','ok');
  }catch(e){}
}
bootstrap();
</script>
